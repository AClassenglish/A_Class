<style>
:root{--primary:#0FA6B3;--primary-dark:#087F89;--primary-light:#E8F7EE;--secondary:#78D64B;--gradient-start:#0FA6B3;--gradient-end:#78D64B;--gradient-accent:linear-gradient(135deg,#0FA6B3 0%,#35C78D 50%,#78D64B 100%);--gradient-story:linear-gradient(45deg,#0FA6B3 0%,#35C78D 50%,#78D64B 100%);--text-dark:#102022;--text-gray:#4B5B5D;--text-light:#8B999B;--white:#fff;--bg-light:#F7FBF8;--border:#E3ECE8;--whatsapp-green:#25D366;--glass-bg:rgba(255,255,255,.92);--glass-border:rgba(238,240,246,.8)}
*,::before,::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html {scroll-padding-top:110px;width:100%;overflow-x:hidden}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;color:var(--text-dark);line-height:1.6;background:var(--white);overflow-x:hidden;padding-bottom:80px;-webkit-font-smoothing:antialiased;width:100%;max-width:100vw}
img{max-width:100%;height:auto;display:block}
button{font-family:inherit}
a{color:inherit;text-decoration:none}

/* Backgrounds */
.animated-bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;background:linear-gradient(135deg,#fff 0%,#F7FBF8 50%,#F2F9F5 100%)}
.floating-shape{position:absolute;border-radius:50%;background:linear-gradient(135deg,var(--gradient-start),var(--gradient-end));opacity:.04;filter:blur(100px);animation:float 30s infinite ease-in-out}
.floating-shape:nth-child(1){width:500px;height:500px;top:-150px;right:-150px}
.floating-shape:nth-child(2){width:400px;height:400px;bottom:-100px;left:-100px;animation-delay:10s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-40px) scale(1.05)}}

.header-animations{position:fixed;top:0;left:0;right:0;height:500px;z-index:-1;overflow:hidden;pointer-events:none}
.header-blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.15}
.header-blob-1{width:300px;height:300px;background:var(--primary);top:-100px;left:10%;animation:blobMove1 12s ease-in-out infinite}
.header-blob-2{width:250px;height:250px;background:var(--secondary);top:-50px;right:15%;animation:blobMove2 15s ease-in-out infinite}
.header-blob-3{width:200px;height:200px;background:var(--primary);top:100px;left:50%;animation:blobMove3 18s ease-in-out infinite}
@keyframes blobMove1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(50px,30px) scale(1.1)}}
@keyframes blobMove2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-40px,40px) scale(.9)}}
@keyframes blobMove3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-20px) scale(1.15)}}

/* Side Tracks */
.side-tracks{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:1;overflow:hidden}
.side-track{position:absolute;top:0;bottom:0;width:50px;overflow:hidden;background:rgba(255,255,255,.6);backdrop-filter:blur(5px);border-left:1px solid var(--border);border-right:1px solid var(--border)}
.side-track.left{left:0}
.side-track.right{right:0}
.side-track-content{display:flex;flex-direction:column;gap:3rem;padding:4rem 0}
.side-track.left .side-track-content{animation:scrollUp 35s linear infinite}
.side-track.right .side-track-content{animation:scrollDown 35s linear infinite}
@keyframes scrollUp{0%{transform:translateY(0)}100%{transform:translateY(-50%)}}
@keyframes scrollDown{0%{transform:translateY(-50%)}100%{transform:translateY(0)}}
.track-label{writing-mode:vertical-rl;text-orientation:mixed;transform:rotate(180deg);font-size:.9rem;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--primary);opacity:.5;padding:1rem 0;white-space:nowrap}
.track-label-dot{width:6px;height:6px;background:var(--primary);border-radius:50%;margin:0 auto;opacity:.4}

/* Mobile Header Track */
.mobile-header-track{display:none;position:fixed;top:70px;left:0;right:0;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);z-index:997;padding:.5rem 0;overflow:hidden}
.track-row{display:flex;gap:1.5rem;white-space:nowrap;font-size:.7rem;font-weight:700;letter-spacing:1px;color:var(--primary)}
.track-row-left{animation:scrollLeft 15s linear infinite}
.track-row-right{animation:scrollRight 15s linear infinite}
@keyframes scrollLeft{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes scrollRight{0%{transform:translateX(-50%)}100%{transform:translateX(0)}}
.track-row .track-dot{width:3px;height:3px;background:var(--primary);border-radius:50%;opacity:.5;align-self:center}

/* Navbar */
.navbar{position:fixed;top:0;left:0;right:0;background:var(--glass-bg);backdrop-filter:blur(15px);border-bottom:1px solid var(--glass-border);z-index:1000;padding:1rem 0;transition:padding .3s ease,box-shadow .3s ease;width:100%}
.navbar.scrolled{padding:.75rem 0;box-shadow:0 4px 20px rgba(15,166,179,.08)}
.nav-container{max-width:1400px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:0 2rem;position:relative;z-index:2}
.logo{display:flex;align-items:center;gap:.75rem}
.logo-img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid var(--primary)}
.logo-text{font-size:1.4rem;font-weight:800;background:var(--gradient-accent);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1.5px}
.nav-menu{display:flex;align-items:center;gap:2rem;list-style:none}
.nav-link{color:var(--text-gray);font-weight:500;font-size:.95rem;transition:color .3s ease;position:relative;display:flex;align-items:center;gap:.35rem;cursor:pointer}
.nav-link:hover{color:var(--primary)}
.nav-cta{background:var(--gradient-accent);color:#fff!important;padding:.7rem 1.5rem;border-radius:50px;font-weight:600;transition:all .3s}
.nav-cta:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(15,166,179,.3)}
.menu-toggle{display:none;background:none;border:none;font-size:1.4rem;cursor:pointer;color:var(--primary);width:40px;height:40px;align-items:center;justify-content:center;border-radius:10px}
/* Mobile Tab Bar */
.mobile-tab-bar{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--glass-bg);backdrop-filter:blur(15px);border-top:1px solid var(--glass-border);z-index:1000;padding:.5rem 0;box-shadow:0 -4px 20px rgba(15,166,179,.1);width:100%}
.tab-bar-container{display:flex;justify-content:space-around;align-items:center;max-width:500px;margin:0 auto}
.tab-item{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.5rem;color:var(--text-gray);font-size:.7rem;font-weight:600;transition:color .3s;flex:1;gap:.25rem}
.tab-item i{font-size:1.3rem;margin-bottom:.2rem;transition:transform .3s}
.tab-item.active{color:var(--primary)}
.tab-item.active i{transform:translateY(-2px)}

/* Hero */
.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10rem 0 6rem;position:relative;width:100%}
.hero-container{max-width:100%;margin:0 auto;text-align:center;position:relative;z-index:2;padding:0 2rem;width:100%}
.hero-badge{display:inline-flex;align-items:center;gap:.5rem;background:var(--primary-light);color:var(--primary-dark);padding:.5rem 1.2rem;border-radius:50px;font-size:.85rem;font-weight:600;margin-bottom:2rem;border:1px solid rgba(15,166,179,.15)}
.hero h1{font-size:3.8rem;font-weight:800;line-height:1.1;margin-bottom:1.5rem;letter-spacing:-1.5px;color:var(--text-dark)}
.hero h1 span{background:var(--gradient-accent);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{font-size:1.15rem;margin-bottom:2.5rem;color:var(--text-gray);max-width:600px;margin-left:auto;margin-right:auto}
.hero-buttons{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin-bottom:3.5rem}
.btn{padding:.95rem 2rem;border-radius:50px;font-weight:600;display:inline-flex;align-items:center;gap:.7rem;transition:all .3s;cursor:pointer;border:none;font-size:1rem;font-family:inherit}
.btn-primary{background:var(--gradient-accent);color:#fff}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(15,166,179,.35)}
.btn-secondary{background:#fff;color:var(--primary);border:1.5px solid var(--primary)}
.btn-secondary:hover{background:var(--primary-light);transform:translateY(-3px)}
.hero-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1.5rem;max-width:800px;margin:0 auto}
.hero-stat{background:#fff;padding:1.5rem;border-radius:16px;border:1px solid var(--border);transition:all .3s}
.hero-stat:hover{transform:translateY(-4px);border-color:var(--primary)}
.hero-stat-number{font-size:2rem;font-weight:800;background:var(--gradient-accent);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.3rem}
.hero-stat-label{font-size:.85rem;color:var(--text-gray);font-weight:500}

/* Reviews */
.reviews-section{padding:5rem 2rem 6rem;position:relative;z-index:2;width:100%}
.reviews-header{text-align:center;margin-bottom:3rem}
.reviews-header h2{font-size:2.5rem;font-weight:800;background:var(--gradient-accent);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.75rem}
.reviews-header p{color:var(--text-gray);font-size:1.05rem}
.reviews-swiper{padding:2rem 0 3rem;overflow:visible!important;width:100%;max-width:600px;margin:0 auto}
.swiper-slide{transition:all .6s cubic-bezier(.4,0,.2,1);opacity:.4;filter:blur(3px);transform:scale(.85);border-radius:16px;overflow:hidden;border:1px solid var(--border);background:#fff}
.swiper-slide img{width:100%;height:auto;display:block;pointer-events:none;user-select:none}
.swiper-slide-active{opacity:1;filter:blur(0);transform:scale(1);box-shadow:0 25px 60px rgba(15,166,179,.25);z-index:10;border-color:var(--primary)}
.swiper-button-prev,.swiper-button-next{color:var(--primary);background:#fff;width:45px;height:45px;border-radius:50%;box-shadow:0 4px 15px rgba(15,166,179,.15);border:1.5px solid var(--primary);transition:all .3s}
.swiper-button-prev::after,.swiper-button-next::after{font-size:1rem;font-weight:800}
.swiper-button-prev:hover,.swiper-button-next:hover{background:var(--gradient-accent);color:#fff;border-color:transparent;transform:scale(1.1)}
.swiper-pagination-bullet{width:10px;height:10px;background:var(--border);opacity:1;transition:all .3s}
.swiper-pagination-bullet-active{background:var(--primary);width:28px;border-radius:5px}

/* Video Collage */
.video-collage-section{padding:4rem 2rem;background:var(--bg-light);width:100%;position:relative;cursor:default}
.video-collage-container{max-width:1200px;margin:0 auto}
.video-collage-heading{text-align:center;margin-bottom:3rem}
.video-collage-heading h2{font-size:2.5rem;font-weight:800;background:var(--gradient-accent);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.75rem}
.video-collage-heading p{color:var(--text-gray);font-size:1.05rem}
.video-collage-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}
.video-collage-item{position:relative;border-radius:16px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.12);aspect-ratio:9/16}
.video-collage-item video{width:100%;height:100%;object-fit:cover;display:block}

/* General Sections */
.about,.courses,.how-it-works,.packages,.contact,.teachers-section{padding:6rem 2rem;position:relative;z-index:2;width:100%}
.about,.how-it-works,.contact,.teachers-section{background:var(--bg-light)}
.courses,.packages{background:var(--white)}
.container{max-width:1300px;margin:0 auto;width:100%}
.section-header{text-align:center;margin-bottom:3.5rem}
.section-tag{display:inline-flex;align-items:center;gap:.5rem;background:var(--primary-light);color:var(--primary-dark);padding:.5rem 1.25rem;border-radius:50px;font-size:.85rem;font-weight:600;margin-bottom:1.25rem;border:1px solid rgba(15,166,179,.15)}
.section-header h2{font-size:2.5rem;font-weight:800;color:var(--text-dark);margin-bottom:1rem}
.section-header p{color:var(--text-gray);max-width:600px;margin:0 auto;font-size:1.05rem}

/* About */
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:center}
.about-text h3{font-size:2rem;color:var(--text-dark);margin-bottom:1.25rem;font-weight:700}
.about-text p{color:var(--text-gray);margin-bottom:1.25rem;font-size:1rem}
.about-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1.25rem;margin-top:2.5rem}
.stat-card{background:#fff;padding:1.75rem;border-radius:16px;text-align:center;border:1px solid var(--border)}
.stat-number{font-size:2.5rem;font-weight:800;background:var(--gradient-accent);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.4rem}
.stat-label{font-size:.9rem;color:var(--text-gray);font-weight:500}

/* Courses */
.courses-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:2rem}
.course-card{background:#fff;border-radius:20px;padding:2.5rem;border:1px solid var(--border);transition:all .4s}
.course-card:hover{transform:translateY(-8px);border-color:var(--primary);box-shadow:0 15px 40px rgba(15,166,179,.12)}
.course-icon{width:65px;height:65px;margin-bottom:1.5rem;background:var(--primary-light);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;color:var(--primary)}
.course-card h3{color:var(--text-dark);margin-bottom:1rem;font-size:1.4rem;font-weight:700}
.course-card p{color:var(--text-gray);font-size:.95rem;margin-bottom:1.5rem}
.course-features{list-style:none}
.course-features li{padding:.6rem 0;color:var(--text-gray);display:flex;align-items:flex-start;gap:.75rem;font-size:.9rem;border-bottom:1px solid var(--border)}
.course-features li:last-child{border-bottom:none}
.course-features li::before{content:'✓';color:var(--primary);font-weight:700;font-size:1.1rem;flex-shrink:0}

/* Steps */
.steps-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:2rem}
.step-card{background:#fff;padding:2.5rem;border-radius:18px;position:relative;border:1px solid var(--border)}
.step-number{position:absolute;top:-16px;left:2rem;width:45px;height:45px;background:var(--gradient-accent);color:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.2rem}
.step-card h4{color:var(--text-dark);margin:1.25rem 0 .75rem;font-size:1.2rem;font-weight:700}
.step-card p{color:var(--text-gray);font-size:.95rem}

/* Packages Preview */
.packages-preview-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:2rem;max-width:1100px;margin:0 auto 3rem}
.package-preview-card{background:#fff;border-radius:20px;padding:2.5rem;border:1px solid var(--border);text-align:center;transition:all .4s}
.package-preview-card:hover{transform:translateY(-8px);border-color:var(--primary);box-shadow:0 15px 40px rgba(15,166,179,.2)}
.package-preview-card.featured{background:linear-gradient(135deg,var(--gradient-start),var(--gradient-end));color:#fff;border-color:transparent}
.package-preview-icon{width:70px;height:70px;background:var(--primary-light);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--primary);font-size:2rem;margin:0 auto 1.5rem}
.package-preview-card.featured .package-preview-icon{background:rgba(255,255,255,.2);color:#fff}
.package-preview-name{font-size:1.5rem;font-weight:700;margin-bottom:.75rem}
.package-preview-price{font-size:1.1rem;margin-bottom:1.5rem;opacity:.9}
.package-preview-card.featured .package-preview-price{opacity:1}
.package-preview-features{list-style:none;text-align:left;margin-top:1.5rem}
.package-preview-features li{padding:.6rem 0;display:flex;align-items:center;gap:.75rem;font-size:.95rem;color:var(--text-gray);border-bottom:1px solid var(--border)}
.package-preview-card.featured .package-preview-features li{color:rgba(255,255,255,.9);border-bottom-color:rgba(255,255,255,.2)}
.package-preview-features li:last-child{border-bottom:none}
.package-preview-features li i{color:var(--primary);width:20px;text-align:center}
.package-preview-card.featured .package-preview-features li i{color:#DDF4E4}
.explore-more-container{text-align:center;margin-top:3rem}
.btn-explore{background:#fff;color:var(--primary);border:1.5px solid var(--primary);padding:.95rem 2rem;border-radius:50px;font-weight:600;font-size:1rem;display:inline-flex;align-items:center;gap:.6rem;transition:all .3s}
.btn-explore:hover{background:var(--gradient-accent);color:#fff;border-color:transparent;transform:translateY(-3px);box-shadow:0 10px 25px rgba(15,166,179,.3)}

/* Teachers */
.teachers-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(350px,1fr));gap:3rem;max-width:900px;margin:0 auto}
.teacher-card{text-align:center;padding:2.5rem 2rem;background:#fff;border-radius:24px;border:1px solid var(--border);transition:all .4s}
.teacher-card:hover{transform:translateY(-8px);box-shadow:0 15px 40px rgba(15,166,179,.15);border-color:var(--primary)}
.teacher-image-wrapper{width:150px;height:150px;margin:0 auto 1.5rem;border-radius:50%;overflow:hidden;border:4px solid var(--primary-light);box-shadow:0 8px 25px rgba(15,166,179,.2)}
.teacher-image-wrapper img{width:100%;height:100%;object-fit:cover}
.teacher-card h3{font-size:1.5rem;font-weight:800;color:var(--text-dark);margin-bottom:.5rem}
.teacher-title{display:inline-block;background:var(--gradient-accent);color:#fff;padding:.4rem 1rem;border-radius:50px;font-size:.85rem;font-weight:600;margin-bottom:1.25rem}
.teacher-card p{color:var(--text-gray);font-size:.95rem;line-height:1.7;text-align:justify;margin-bottom:.75rem}



/* Let the browser defer rendering of distant sections until they approach the viewport. */
.reviews,.video-collage,.about,.courses,.how-it-works,.packages,.teachers-section-packages,.placement-cta,.contact,footer{
  content-visibility:auto;
  contain-intrinsic-size:700px;
}

/* ===== Teacher Spotlight ===== */
.teachers-section-packages{
  background:var(--bg-light);
  padding:7rem 2rem;
  position:relative;
  overflow:hidden;
}
.teachers-section-packages::before{
  content:"";
  position:absolute;
  width:520px;
  height:520px;
  right:-220px;
  top:-180px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(15,166,179,.12),transparent 68%);
  pointer-events:none;
}
.teachers-container{
  max-width:1240px;
  margin:0 auto;
  position:relative;
  z-index:1;
}
.teachers-intro{
  max-width:760px;
  margin:0 auto 4rem;
  text-align:center;
}
.teachers-kicker{
  display:inline-flex;
  align-items:center;
  gap:.5rem;
  color:var(--primary);
  background:var(--primary-light);
  border:1px solid rgba(15,166,179,.16);
  border-radius:999px;
  padding:.55rem 1rem;
  font-size:.78rem;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
  margin-bottom:1.25rem;
}
.teachers-intro h2{
  font-size:clamp(2.2rem,4vw,3.7rem);
  line-height:1.05;
  letter-spacing:-1.8px;
  margin-bottom:1rem;
}
.teachers-intro p{
  max-width:620px;
  margin:0 auto;
  color:var(--text-gray);
  font-size:1.05rem;
}
.teacher-showcase{
  display:grid;
  grid-template-columns:180px minmax(320px,520px) minmax(360px,1fr);
  align-items:center;
  gap:3.5rem;
  min-height:650px;
}
.teacher-rail{
  display:flex;
  flex-direction:column;
  gap:1rem;
}
.teacher-rail-item{
  position:relative;
  text-align:left;
  border:0;
  background:transparent;
  padding:1.25rem 1rem 1.25rem 1.25rem;
  border-radius:18px;
  cursor:pointer;
  color:var(--text-gray);
  transition:background .3s ease,color .3s ease,transform .3s ease;
}
.teacher-rail-item::before{
  content:"";
  position:absolute;
  left:0;
  top:15px;
  bottom:15px;
  width:3px;
  border-radius:99px;
  background:transparent;
  transition:background .3s ease;
}
.teacher-rail-item:hover{
  background:#fff;
  transform:translateX(4px);
}
.teacher-rail-item.active{
  background:#fff;
  color:var(--text-dark);
  box-shadow:0 12px 35px rgba(15,23,42,.07);
}
.teacher-rail-item.active::before{background:var(--primary);}
.teacher-rail-number{
  display:block;
  font-size:.7rem;
  font-weight:800;
  letter-spacing:.12em;
  color:var(--primary);
  margin-bottom:.45rem;
}
.teacher-rail-name{
  display:block;
  font-size:1.2rem;
  font-weight:800;
  margin-bottom:.2rem;
}
.teacher-rail-role{
  display:block;
  font-size:.75rem;
  line-height:1.4;
}
.teacher-visual{
  position:relative;
  min-height:620px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.teacher-frame{
  position:absolute;
  width:min(100%,430px);
  height:560px;
  border:1px solid rgba(15,166,179,.24);
  pointer-events:none;
}
.teacher-frame-back{
  transform:rotate(-4deg) translate(-18px,12px);
  border-radius:92px 22px 88px 28px;
  background:rgba(15,166,179,.07);
}
.teacher-frame-front{
  transform:rotate(2.5deg);
  border-radius:28px 92px 24px 82px;
  padding:13px;
  background:linear-gradient(145deg,rgba(255,255,255,.9),rgba(245,240,250,.95));
  box-shadow:0 30px 70px rgba(72,43,103,.16);
  transition:transform .55s cubic-bezier(.2,.8,.2,1),border-radius .55s ease;
}
.teacher-photo-wrap{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  border-radius:20px 76px 18px 68px;
  background:#E7EFEA;
}
.teacher-photo-wrap img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  transition:opacity .28s ease,transform .65s cubic-bezier(.2,.8,.2,1),filter .5s ease;
}
.teacher-photo-overlay{
  position:absolute;
  left:1rem;
  right:1rem;
  bottom:1rem;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:.75rem .9rem;
  border-radius:14px;
  color:#fff;
  font-size:.72rem;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
  background:rgba(15,23,42,.58);
  backdrop-filter:blur(10px);
  opacity:0;
  transform:translateY(10px);
  transition:opacity .3s ease,transform .3s ease;
}
.teacher-showcase:hover .teacher-photo-overlay,
.teacher-photo-wrap:hover .teacher-photo-overlay{
  opacity:1;
  transform:translateY(0);
}
.teacher-photo-wrap:hover img{
  transform:scale(1.09);
  filter:saturate(1.04);
}
.teacher-visual:hover .teacher-frame-front{
  transform:rotate(0deg) scale(1.015);
  border-radius:22px 66px 22px 62px;
}
.teacher-photo-caption{
  position:absolute;
  bottom:3px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:.6rem;
  color:var(--text-gray);
  font-size:.65rem;
  font-weight:800;
  letter-spacing:.16em;
}
.teacher-photo-line{
  width:34px;
  height:1px;
  background:var(--primary);
  opacity:.5;
}
.teacher-copy{
  padding:2rem 0 2rem 1rem;
}
.teacher-copy-top{
  display:flex;
  align-items:center;
  gap:.65rem;
  color:var(--primary);
  font-size:.7rem;
  font-weight:800;
  letter-spacing:.13em;
  text-transform:uppercase;
  margin-bottom:1.5rem;
}
.teacher-slide-count{color:var(--text-gray);}
.teacher-dot{width:5px;height:5px;border-radius:50%;background:var(--primary);}
.teacher-copy h3{
  font-size:clamp(3rem,5vw,5.3rem);
  line-height:.9;
  letter-spacing:-3px;
  margin-bottom:1rem;
}
.teacher-role{
  display:inline-flex;
  padding:.45rem .9rem;
  border-radius:999px;
  background:var(--gradient-accent);
  color:#fff;
  font-size:.78rem;
  font-weight:800;
  margin-bottom:1.5rem;
}
.teacher-copy p{
  max-width:610px;
  color:var(--text-gray);
  font-size:.98rem;
  line-height:1.8;
  margin-bottom:.9rem;
}
.teacher-metrics{
  display:flex;
  flex-wrap:wrap;
  gap:1px;
  margin:2rem 0;
  background:var(--border);
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  max-width:620px;
}
.teacher-metric{
  flex:1 1 120px;
  min-width:110px;
  padding:1rem 1.1rem;
  background:#fff;
}
.teacher-metric strong{
  display:block;
  font-size:1.45rem;
  line-height:1;
  color:var(--text-dark);
  margin-bottom:.35rem;
}
.teacher-metric span{
  display:block;
  color:var(--text-gray);
  font-size:.68rem;
  font-weight:700;
}
.teacher-controls{
  display:flex;
  align-items:center;
  gap:1rem;
  max-width:620px;
}
.teacher-arrow{
  flex:0 0 46px;
  width:46px;
  height:46px;
  border-radius:50%;
  border:1px solid var(--border);
  background:#fff;
  color:var(--text-dark);
  cursor:pointer;
  transition:all .25s ease;
}
.teacher-arrow:hover{
  color:#fff;
  background:var(--gradient-accent);
  border-color:transparent;
  transform:translateY(-2px);
}
.teacher-progress{
  flex:1;
  height:3px;
  background:#e9e8ef;
  border-radius:99px;
  overflow:hidden;
}
.teacher-progress span{
  display:block;
  width:50%;
  height:100%;
  background:var(--gradient-accent);
  border-radius:inherit;
  transition:width .35s ease;
}

/* Georgian language layout fixes */
.lang-ge .nav-menu{gap:1.15rem}
.lang-ge .nav-link{font-size:.84rem}
.lang-ge .nav-cta{padding:.68rem 1.15rem;font-size:.9rem;white-space:nowrap}
.lang-ge .hero-container{max-width:1400px;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(340px,.82fr);gap:4rem;align-items:center;text-align:left}
.lang-ge .hero-badge{grid-column:1/-1;justify-self:start;margin-bottom:0}
.lang-ge .hero h1{min-width:0;font-size:clamp(3rem,4vw,4.7rem);line-height:1.08;letter-spacing:-1px;overflow-wrap:anywhere;word-break:normal;margin-bottom:1.2rem}
.lang-ge .hero p{max-width:650px;margin:0 0 2.5rem;align-self:center;line-height:1.75}
.lang-ge .hero-buttons{justify-content:flex-start}
.lang-ge .hero-stats{grid-column:1/-1}
@media (max-width:1100px){
  .lang-ge .nav-menu{gap:.75rem}
  .lang-ge .nav-link{font-size:.78rem}
  .lang-ge .hero-container{grid-template-columns:1fr 1fr;gap:2.5rem}

}
@media (max-width:768px){
  .lang-ge .nav-menu{gap:0}
  .lang-ge .hero-container{display:block;text-align:center;max-width:100%;padding:0 1.25rem}
  .lang-ge .hero-badge{justify-self:center;margin-bottom:1.5rem}
  .lang-ge .hero h1{font-size:clamp(2.2rem,9vw,3rem);overflow-wrap:anywhere}
  .lang-ge .hero p{margin:0 auto 2rem;max-width:650px}
  .lang-ge .hero-buttons{justify-content:center}
}

/* Georgian AClass Life editorial text fix */
.lang-ge .life-editorial-intro{
  grid-template-columns:minmax(0,1.1fr) minmax(360px,.9fr);
  gap:3.5rem;
  align-items:end;
}
.lang-ge .life-editorial-heading{
  max-width:650px;
  min-width:0;
}
.lang-ge .life-editorial-heading h2{

  letter-spacing:-2px;
  overflow-wrap:anywhere;
  word-break:normal;
}
.lang-ge .life-editorial-intro > p{
  max-width:540px;
  font-size:1rem;
  line-height:1.8;
}
@media (max-width:1100px){
  .lang-ge .life-editorial-intro{
    grid-template-columns:minmax(0,1fr) minmax(300px,.9fr);
    gap:2.5rem;
  }
  .lang-ge .life-editorial-heading h2{
    font-size:clamp(2.5rem,4.2vw,3.7rem);
  }
}
@media (max-width:768px){

    display:block;
    margin-bottom:2.5rem;
  }
  .lang-ge .life-editorial-heading{
    max-width:100%;
    margin-bottom:1.75rem;
  }
  .lang-ge .life-editorial-heading h2{
    font-size:clamp(2.35rem,9vw,3.2rem);
    letter-spacing:-1.5px;
  }
  .lang-ge .life-editorial-intro > p{
    max-width:100%;
    padding-left:1rem;
  }
}

/* ===== Package view polish + accessibility ===== */
.package-view-panel{display:none;}
.package-view-panel.active{display:block;animation:packageFade .35s ease;}
@keyframes packageFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.package-view-btn{cursor:pointer;}
.package-view-btn:focus-visible,
.teacher-rail-item:focus-visible,
.teacher-arrow:focus-visible{
  outline:3px solid rgba(15,166,179,.35);
  outline-offset:3px;
}

/* ===== Performance-friendly motion ===== */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    scroll-behavior:auto!important;
    transition-duration:.01ms!important;
  }
}

/* Placement & Contact */
.placement-cta{background:var(--gradient-accent);color:#fff;text-align:center;padding:5rem 2rem;position:relative;overflow:hidden;z-index:2}
.placement-cta h2{font-size:2.5rem;margin-bottom:1rem;font-weight:800}
.placement-cta p{font-size:1.1rem;margin-bottom:2.5rem;opacity:.95;max-width:600px;margin-left:auto;margin-right:auto}
.test-buttons{display:flex;gap:1.5rem;justify-content:center;flex-wrap:wrap}
.btn-test{background:#fff;color:var(--primary);padding:1rem 2rem;border-radius:50px;font-weight:700;display:inline-flex;align-items:center;gap:.75rem;transition:all .3s;font-size:1rem}
.btn-test:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(0,0,0,.2)}
.contact-buttons{display:flex;gap:1.25rem;justify-content:center;flex-wrap:wrap;max-width:600px;margin:0 auto}
.contact-btn{display:inline-flex;align-items:center;gap:.75rem;padding:1rem 2rem;border-radius:50px;font-weight:600;font-size:1rem;transition:all .3s}
.contact-btn.whatsapp{background:var(--whatsapp-green);color:#fff}
.contact-btn.instagram{background:var(--gradient-story);color:#fff}
.contact-btn:hover{transform:translateY(-4px);box-shadow:0 10px 25px rgba(0,0,0,.15)}
.contact-note{text-align:center;margin-top:2.5rem;padding:1.5rem;background:#fff;border-radius:16px;color:var(--text-gray);font-size:.95rem;border:1px solid var(--border)}

/* Footer */
footer{background:var(--text-dark);color:var(--text-light);padding:4rem 2rem 2rem;position:relative;z-index:2;width:100%}
.footer-grid{max-width:1300px;margin:0 auto;display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:2.5rem;margin-bottom:3rem}
.footer-col h4{color:#fff;margin-bottom:1.25rem;font-size:1.1rem;font-weight:700}
.footer-col p{font-size:.95rem;line-height:1.7;margin-bottom:.75rem}
.footer-links{list-style:none}
.footer-links a{color:var(--text-light);display:flex;align-items:center;gap:.5rem;margin-bottom:.75rem;transition:all .3s;font-size:.95rem}
.footer-links a:hover{color:var(--primary);transform:translateX(6px)}
.social-links{display:flex;gap:.9rem;margin-top:1.25rem}
.social-links a{width:42px;height:42px;border-radius:50%;background:rgba(15,166,179,.1);border:1.5px solid var(--primary);display:flex;align-items:center;justify-content:center;color:var(--primary);font-size:1.1rem;transition:all .3s}
.social-links a:hover{background:var(--gradient-accent);color:#fff;border-color:transparent;transform:translateY(-4px)}
.footer-bottom{max-width:1300px;margin:0 auto;padding-top:2rem;border-top:1px solid rgba(255,255,255,.1);text-align:center;font-size:.9rem;color:var(--text-light)}

/* Responsive */
@media (max-width:1024px){
  .hero h1{font-size:3rem}
  .hero-stats{grid-template-columns:repeat(2,1fr)}
  .about-grid{grid-template-columns:1fr;gap:3rem}
  .footer-grid{grid-template-columns:1fr 1fr}
  .side-tracks{display:none}
  .custom-cursor{display:none!important}
  .video-collage-grid{grid-template-columns:repeat(2,1fr);gap:.8rem}
}

  .mobile-header-track{display:none}
  .mobile-tab-bar{display:block}
  .nav-menu{display:none}
  .menu-toggle{display:flex}
  .hero{padding:11rem 0 4rem}
  .hero h1{font-size:2.2rem}
  .hero p{font-size:1rem}
  .hero-stats{grid-template-columns:1fr 1fr;gap:1rem}
  .hero-stat{padding:1.25rem}
  .hero-stat-number{font-size:1.75rem}
  .section-header h2,.reviews-header h2{font-size:2rem}
  .courses-grid{grid-template-columns:1fr}

  .reviews-swiper{padding:1rem 0 2rem}

  .video-collage-heading h2{font-size:2rem}

}
@media (max-width:480px){
  .hero h1{font-size:1.9rem}
  .section-header h2,.reviews-header h2{font-size:1.75rem}

  .btn{padding:.9rem 1.75rem;font-size:.95rem}
  .video-collage-heading h2{font-size:1.8rem}
}

/* Language switcher */
.language-switcher {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-left: 8px;
  padding: 4px;
  border: 1px solid rgba(255,255,255,.18);
  border-radius: 999px;
  background: rgba(255,255,255,.08);

}
.language-switcher a {

.packages-container {

    padding: 5rem 2rem;
  }

.packages-section-title {
    text-align: center;
    margin-bottom: 3rem;
  }

.packages-section-title h2 {
    font-size: 2.2rem;
    font-weight: 800;
    color: var(--text-dark);
    margin-bottom: 0.75rem;
    letter-spacing: -0.5px;
  }

.packages-section-title p {
    color: var(--text-gray);
    font-size: 1.05rem;
  }

.package-accordion {
    background: white;
    border-radius: 20px;
    margin-bottom: 1.5rem;
    border: 1px solid var(--border);
    overflow: visible;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);

.package-accordion:hover {

    display: flex;
    align-items: center;

    gap: 1.5rem;

.package-header:hover {

.package-header-left {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    flex: 1;

.package-icon {
    width: 60px;
    height: 60px;
    background: var(--primary-light);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 1.5rem;

.package-header-content { flex: 1; }

.package-subtitle {

<article class="course-card"><div class="course-icon"><i class="fas fa-graduation-cap"></i></div><h3>IELTS-ის მომზადება</h3><p>ისწავლე ეფექტური საგამოცდო სტრატეგიები, გაიუმჯობესე აკადემიური ლექსიკა და გრამატიკა და ივარჯიშე IELTS-ის ფორმატის დავალებებით.</p><ul class="course-features"><li>განსაკუთრებული ყურადღება წერით და სასაუბრო უნარებზე</li><li>პერსონალური შესწორებები და რეკომენდაციები</li><li>სამაგალითო პასუხები და პრაქტიკული მითითებები</li><li>ბენდის ქულის გასაუმჯობესებელი დადასტურებული სტრატეგიები</li></ul></article>
<article class="course-card"><div class="course-icon"><i class="fas fa-book-open"></i></div><h3>SAT-ის მომზადება</h3><p>განავითარე ცოდნა, სიზუსტე და დროის მართვის უნარები, რომლებიც ციფრული SAT-ისთვის არის საჭირო.</p><ul class="course-features"><li>კითხვა, გრამატიკა, მათემატიკა და ლექსიკა</li><li>ამოცანების გადაჭრის სტრატეგიები</li><li>დროის მართვის ტექნიკები</li><li>რეგულარული საცდელი ტესტები</li></ul></article>
<article class="course-card"><div class="course-icon"><i class="fas fa-comments"></i></div><h3>ზოგადი ინგლისური</h3><p>გაიუმჯობესე ინგლისურის საერთო დონე სწავლის, სამუშაოს, მოგზაურობის ან ყოველდღიური კომუნიკაციისთვის.</p><ul class="course-features"><li>საუბრის თავდაჯერებულობა და გამოთქმა</li><li>მოსმენისა და კითხვის უნარები</li><li>გრამატიკული სიზუსტე და ლექსიკა</li><li>რეალურ სიტუაციებზე დაფუძნებული პრაქტიკა</li></ul></article>

<section class="how-it-works">

    if (!teacherImages.has(teacher.image)) {
      const img = new Image();
      img.decoding = 'async';
      img.src = teacher.image;
      teacherImages.set(teacher.image, img);
    }
    return teacherImages.get(teacher.image);
  };

  function renderTeacher(index) {
    teacherIndex = (index + teacherData.length) % teacherData.length;
    const teacher = teacherData[teacherIndex];

    const updateContent = () => {
      photo.src = teacher.image;
      photo.alt = teacher.alt;

      name.textContent = teacher.name;
      role.textContent = teacher.role;
      specialty.textContent = teacher.specialty;

      description.textContent = teacher.description;
      description2.textContent = teacher.description2;

        item.setAttribute('aria-current', active ? 'true' : 'false');
      });
    };

    /* Load only the selected teacher image; other teacher images load on demand. */
    const image = getTeacherImage(teacher);

    if (image && image.complete) {
      updateContent();
    } else if (image) {
      image.onload = updateContent;
      image.onerror = updateContent;
    } else {
      updateContent();
    }
  }

  railItems.forEach(item => {
    const selectTeacher = () => renderTeacher(Number(item.dataset.teacher));
    item.addEventListener('click', selectTeacher);
  });

  document.getElementById('teacherPrev')?.addEventListener('click', () => renderTeacher(teacherIndex - 1));
  document.getElementById('teacherNext')?.addEventListener('click', () => renderTeacher(teacherIndex + 1));

  renderTeacher(0);

  /* Warm the browser cache for the other teacher portraits in the background.
     This keeps teacher switching immediate without downloading everything
     before the page becomes interactive. */
  const warmTeacherImages = () => {
    teacherData.forEach((teacher) => getTeacherImage(teacher));
  };
  if ('requestIdleCallback' in window) {
    requestIdleCallback(warmTeacherImages, { timeout: 1500 });
  } else {
    setTimeout(warmTeacherImages, 250);
  }

  /* Mobile menu */
  const navMenu = document.getElementById('navMenu');
  const menuToggle = document.getElementById('menuToggle');
  if (navMenu && menuToggle) {
    menuToggle.addEventListener('click', () => navMenu.classList.toggle('active'));
    document.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', () => navMenu.classList.remove('active'));
    });
  }

  /* Navbar shadow */
  const navbar = document.querySelector('.navbar');
  if (navbar) {
    const updateNav = () => navbar.classList.toggle('scrolled', window.scrollY > 50);
    updateNav();
    window.addEventListener('scroll', updateNav, { passive: true });
  }

  /* Mobile tabs */
  document.querySelectorAll('.tab-item').forEach(tab => {
    tab.addEventListener('click', function () {
      document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
      this.classList.add('active');
    });
  });

  /* Reviews slider — waits for deferred Swiper library. */
  function initReviews() {
    if (typeof Swiper === 'undefined' || !document.querySelector('.reviews-swiper')) return;
    if (window.__aclassReviewSwiper) {
      try { window.__aclassReviewSwiper.destroy(true, true); } catch (e) {}
      window.__aclassReviewSwiper = null;
    }
    window.__aclassReviewSwiper = new Swiper('.reviews-swiper', {
      loop: true,
      centeredSlides: true,
      speed: 600,
      spaceBetween: 48,
      slidesPerView: 1.5,
      grabCursor: true,
      touchRatio: 1,
      simulateTouch: true,
      pagination: { el: '.swiper-pagination', clickable: true },
      navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' },
      breakpoints: {
        320: { slidesPerView: 1.1, spaceBetween: 16 },
        769: { slidesPerView: 1.5, spaceBetween: 48 }
      }
    });
  }
  if (typeof Swiper !== 'undefined') {
    initReviews();
  } else if (window.__aclassEnsureSwiper) {
    window.__aclassEnsureSwiper(function () { initReviews(); });
  }

  /* Lazy-load the four collage videos only when they approach the viewport. */
  const lazyVideos = document.querySelectorAll('video[data-lazy-video]');
  if ('IntersectionObserver' in window && lazyVideos.length) {
    const videoObserver = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        const video = entry.target;
        if (!video.dataset.loaded) {
          video.preload = 'metadata';
          video.querySelectorAll('source').forEach(source => {
            if (source.dataset.src) source.src = source.dataset.src;
          });
          video.dataset.loaded = 'true';
          video.load();
          const playPromise = video.play();
          if (playPromise && typeof playPromise.catch === 'function') {
            playPromise.catch(() => {});
          }
        }
        videoObserver.unobserve(video);
      });
    }, { rootMargin: '500px 0px' });

    lazyVideos.forEach(video => {
      videoObserver.observe(video);
    });
  } else {
    lazyVideos.forEach(video => {
      video.preload = 'metadata';
      video.load();
      video.play().catch(() => {});
    });
  }



</script>

(function () {
  'use strict';

  const META = {'en': 'AClass English School — IELTS, SAT & General English', 'ru': 'AClass — Английский для реальной жизни и ваших целей', 'ge': 'AClass ინგლისური სკოლა — IELTS, SAT და ზოგადი ინგლისური'};
  const DESCRIPTIONS = {'en': 'AClass English School — Expert IELTS, SAT, and General English tutoring.', 'ru': 'Школа английского языка AClass — Expert IELTS, SAT, and Общий английский.', 'ge': 'AClass ინგლისური სკოლა — IELTS-ის, SAT-ისა და ზოგადი ინგლისურის პროფესიული სწავლება.'};
  const HTML_LANG = {'en': 'en', 'ru': 'ru', 'ge': 'ka'};
  const SUPPORTED = ['en', 'ge', 'ru'];
  const root = document.getElementById('aclass-site-root');
  const loader = document.getElementById('aclass-language-loading');
  let activeLanguage = null;

  function runLanguageScript(lang) {
    const node = document.getElementById('aclass-script-' + lang);
    if (!node) return;
    const code = node.textContent || '';
    try {
      new Function(code)();
    } catch (error) {
      console.error('AClass language script failed:', lang, error);
    }
  }

  function markLanguageLinks(lang) {
    root.querySelectorAll('[data-aclass-language]').forEach(link => {
      const isActive = link.dataset.aclassLanguage === lang;
      link.classList.toggle('active', isActive);
      link.setAttribute('aria-current', isActive ? 'true' : 'false');
      link.addEventListener('click', function (event) {
        event.preventDefault();
        switchLanguage(this.dataset.aclassLanguage);
      }, { once: true });
    });
  }

  function switchLanguage(lang) {
    if (!SUPPORTED.includes(lang)) lang = 'en';

    activeLanguage = lang;
    root.className = 'lang-' + lang;
    localStorage.setItem('aclass-language', lang);

    if (window.__aclassReviewSwiper) {
      try { window.__aclassReviewSwiper.destroy(true, true); } catch (e) {}
      window.__aclassReviewSwiper = null;
    }

    document.documentElement.lang = HTML_LANG[lang] || lang;
    document.title = META[lang] || META.en;

    const description = document.querySelector('meta[name="description"]');
    if (description) description.setAttribute('content', DESCRIPTIONS[lang] || DESCRIPTIONS.en);

    root.replaceChildren(
      document.getElementById('aclass-template-' + lang).content.cloneNode(true)
    );

    markLanguageLinks(lang);

    // Re-run the exact JavaScript belonging to the selected original homepage.
    runLanguageScript(lang);

    loader.classList.add('hidden');
    window.scrollTo(0, 0);
  }

  document.addEventListener('click', function (event) {
    const link = event.target.closest && event.target.closest('[data-aclass-language]');
    if (link) {
      event.preventDefault();
      switchLanguage(link.dataset.aclassLanguage);
    }
  });

  const saved = localStorage.getItem('aclass-language');
  const initial = SUPPORTED.includes(saved) ? saved : 'en';
  switchLanguage(initial);
})();
</script>

  const FALLBACK_LANGUAGE={en:'en',ru:'ru',ge:'ge'};
  const labels={
    en:{ielts:'IELTS & SAT Packages',general:'General English Packages',ieltsSub:'Structured preparation for international examinations',generalSub:'Improve your overall English level for everyday communication',month:'Lessons/Month',week:'Lessons/Week',duration:'Duration',format:'Class format',price:'Price',contact:'Contact us',group:'Group',individual:'Individual',pair:'Pair',compareExam:'IELTS & SAT Packages Comparison',compareExamSub:'Compare all our exam preparation formats side by side',compareGeneral:'General English Packages Comparison',compareGeneralSub:'Choose between group interaction or personalized one-on-one lessons'},
    ru:{ielts:'Пакеты IELTS и SAT',general:'Общий английский',ieltsSub:'Структурированная подготовка к международным экзаменам',generalSub:'Улучшайте общий уровень английского для общения каждый день',month:'Занятий в месяц',week:'Занятий в неделю',duration:'Длительность',format:'Формат',price:'Цена',contact:'Уточнить цену',group:'Группа',individual:'Индивидуально',pair:'Пара',compareExam:'Сравнение пакетов IELTS и SAT',compareExamSub:'Сравните форматы подготовки к экзаменам',compareGeneral:'Сравнение пакетов общего английского',compareGeneralSub:'Выберите групповые или индивидуальные занятия'},
    ge:{ielts:'IELTS & SAT პაკეტები',general:'ზოგადი ინგლისურის პაკეტები',ieltsSub:'სტრუქტურირებული მომზადება საერთაშორისო გამოცდებისთვის',generalSub:'გაიუმჯობესეთ ინგლისური ყოველდღიური კომუნიკაციისთვის',month:'გაკვეთილი / თვე',week:'გაკვეთილი / კვირა',duration:'ხანგრძლივობა',format:'ფორმატი',price:'ფასი',contact:'ფასი მოთხოვნით',group:'ჯგუფური',individual:'ინდივიდუალური',pair:'წყვილი',compareExam:'IELTS & SAT პაკეტების შედარება',compareExamSub:'შეადარეთ საგამოცდო მომზადების ფორმატები',compareGeneral:'ზოგადი ინგლისურის პაკეტების შედარება',compareGeneralSub:'აირჩიეთ ჯგუფური ან ინდივიდუალური სწავლება'}
  };

  function currentLang(){
    const root=document.getElementById('aclass-site-root');
    const m=root && String(root.className).match(/lang-(en|ru|ge)/);
    return m?m[1]:'en';
  }
  function esc(v){
    return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  }
  function arr(v){ return Array.isArray(v)?v.filter(Boolean):[]; }
  function localized(row,field,lang){ return row[field+'_'+lang] || row[field+'_en'] || ''; }
  function category(row){
    const raw=String(row.category||'').toLowerCase().replace(/[\s-]+/g,'_');
    const key=String(row.package_key||'').toLowerCase();
    if(raw==='ielts_sat' || raw==='ielts_and_sat' || (raw.includes('ielts')&&raw.includes('sat')) || (key.includes('ielts')&&key.includes('sat'))) return 'ielts_sat';
    if(raw==='general_english' || raw.includes('general') || raw.includes('english') || key.includes('general_english')) return 'general_english';
    if(raw.includes('ielts') || key.includes('ielts')) return 'ielts_sat';
    if(raw.includes('sat') || key.includes('sat')) return 'ielts_sat';
    return 'other';
  }
  function iconFor(row){
    const f=String(row.format||'').toLowerCase();
    if(f.includes('pair') || f.includes('2')) return 'fa-user-friends';
    if(f.includes('individual') || f.includes('1-on-1') || f.includes('one')) return 'fa-user';
    if((row.package_key||'').includes('intensive')) return 'fa-bolt';
    if(category(row)==='general_english') return f.includes('individual')?'fa-user-graduate':'fa-comments';
    return 'fa-users';
  }
  function formatValue(row,L){
    if(row.lesson_length_minutes) return esc(row.lesson_length_minutes)+' min';
    return row.format ? esc(row.format) : '—';
  }
  function priceValue(row,L){
    const n=Number(row.price);
    if(row.price!==null && row.price!=='' && Number.isFinite(n) && n>0){
      return esc(new Intl.NumberFormat(undefined,{maximumFractionDigits:2}).format(n))+' '+esc(row.currency||'GEL');
    }
    return '';
  }
  function makeAccordion(row,lang){
    const name=localized(row,'name',lang)||row.package_key;
    const desc=localized(row,'description',lang);
    const features=arr(row['features_'+lang]||row.features_en);
    const L=labels[lang]||labels.en;
    const price=priceValue(row,L);
    const month=row.lessons??'—', week=row.lessons_per_week??'—';
    const duration=formatValue(row,L);
    const format=row.format||'';
    const href='payment.html?package='+encodeURIComponent(row.package_key||name);
    return `<div class="package-accordion" data-cms-package-key="${esc(row.package_key||'')}">
      <div class="package-header"><div class="package-header-left"><div class="package-icon"><i class="fas ${iconFor(row)}"></i></div><div class="package-header-content"><div class="package-title">${esc(name)}</div><div class="package-subtitle">${month} lessons/month${week!==null&&week!==''?' • '+esc(week)+' lessons/week':''}${row.lesson_length_minutes?' • '+esc(row.lesson_length_minutes)+' min':''}</div></div></div></div>
      <div class="package-content"><div class="package-body"><p class="package-description">${esc(desc)}</p>
      <div class="package-details-grid"><div class="package-detail-card"><div class="package-detail-label">${esc(L.month)}</div><div class="package-detail-value">${esc(month)}</div></div><div class="package-detail-card"><div class="package-detail-label">${esc(L.week)}</div><div class="package-detail-value">${esc(week)}</div></div><div class="package-detail-card"><div class="package-detail-label">${esc(L.duration)}</div><div class="package-detail-value">${duration}</div></div>${format?`<div class="package-detail-card"><div class="package-detail-label">${esc(L.format)}</div><div class="package-detail-value">${esc(format)}</div></div>`:''}</div>
      ${features.length?`<div class="package-features-list">${features.map(x=>`<div class="package-feature-item"><i class="fas fa-check"></i> ${esc(x)}</div>`).join('')}</div>`:''}
      ${price?`<div class="package-cms-price">${esc(L.price)}: ${price}</div>`:''}
      <button class="package-cta" onclick="event.stopPropagation(); window.location.href='${href}'">${lang==='ru'?'Записаться':lang==='ge'?'ჩაწერა':'Enroll Now'}</button></div></div></div>`;
  }
  function renderList(lang){
    const list=document.querySelector('#packages #package-list .packages-container');
    if(!list || !Array.isArray(packageRows) || !packageRows.length) return;
    const active=packageRows.filter(r=>r.active!==false);
    const exam=active.filter(r=>category(r)==='ielts_sat');
    const general=active.filter(r=>category(r)==='general_english');
    const other=active.filter(r=>!['ielts_sat','general_english'].includes(category(r)));
    const L=labels[lang]||labels.en;
    let html='';
    if(exam.length){html+=`<div class="packages-section-title" id="ielts-sat"><h2>${esc(L.ielts)}</h2><p>${esc(L.ieltsSub)}</p></div>`+exam.map(r=>makeAccordion(r,lang)).join('');}
    if(general.length){html+=`<div class="packages-section-title" id="general-english" style="margin-top:4rem"><h2>${esc(L.general)}</h2><p>${esc(L.generalSub)}</p></div>`+general.map(r=>makeAccordion(r,lang)).join('');}
    if(other.length) html+=other.map(r=>makeAccordion(r,lang)).join('');
    if(html) list.innerHTML=html;
  }
  function mark(v){ return v?'<i class="fas fa-check"></i>':'<i class="fas fa-minus"></i>'; }
  function compareTable(rows,lang,title,sub){
    const L=labels[lang]||labels.en;
    if(!rows.length) return '';
    const cols=rows.slice(0,10);
    const head=cols.map(r=>`<th>${esc(localized(r,'name',lang)||r.package_key)}</th>`).join('');
    const bodyRows=[
      [L.month,...cols.map(r=>r.lessons??'—')],
      [L.week,...cols.map(r=>r.lessons_per_week??'—')],
      [L.duration,...cols.map(r=>formatValue(r,L).replace(/<[^>]*>/g,''))],
      [L.format,...cols.map(r=>r.format||'—')],
      [L.price,...cols.map(r=>priceValue(r,L)||L.contact)]
    ];
    return `<div class="comparison-block"><div class="comparison-header"><h2>${esc(title)}</h2><p>${esc(sub)}</p></div><div class="comparison-table-wrapper"><table class="comparison-table"><thead><tr><th>Feature</th>${head}</tr></thead><tbody>${bodyRows.map(row=>`<tr>${row.map((c,i)=>`<td>${i===0?esc(c):esc(String(c))}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
  }
  function renderCompare(lang){
    const section=document.querySelector('#package-compare .comparison-container');
    if(!section || !Array.isArray(packageRows) || !packageRows.length) return;
    const active=packageRows.filter(r=>r.active!==false);
    const exam=active.filter(r=>category(r)==='ielts_sat');
    const general=active.filter(r=>category(r)==='general_english');
    const L=labels[lang]||labels.en;
    section.innerHTML=compareTable(exam,lang,L.compareExam,L.compareExamSub)+compareTable(general,lang,L.compareGeneral,L.compareGeneralSub);
  }
  function render(){
    if(!packageRows || !packageRows.length) return;
    const lang=currentLang();
    if(lastRenderedLanguage===lang && document.querySelector('#packages [data-cms-package-key]')) return;
    renderList(lang); renderCompare(lang); lastRenderedLanguage=lang;
    if(location.hash==='#compare') document.querySelector('.package-view-btn[data-view="package-compare"]')?.click();
  }
  async function load(){
    if(packageRows){render();return;}
    if(packageRequest){await packageRequest;return render();}
    packageRequest=fetch(PACKAGE_ENDPOINT,{headers:{apikey:SUPABASE_ANON_KEY,Authorization:'Bearer '+SUPABASE_ANON_KEY},cache:'no-store',signal:AbortSignal.timeout?AbortSignal.timeout(2500):undefined})
      .then(r=>r.ok?r.json():Promise.reject(new Error('Package catalog unavailable')))
      .then(data=>{packageRows=Array.isArray(data)?data:[];render();})
      .catch(()=>{packageRows=[];});
    await packageRequest;
  }
  window.__aclassRefreshPackages=function(){ lastRenderedLanguage=null; render(); };
  const root=document.getElementById('aclass-site-root');
  if(root && 'MutationObserver' in window){
    let timer=null;
    new MutationObserver(()=>{ clearTimeout(timer); timer=setTimeout(()=>{lastRenderedLanguage=null;render();},40); }).observe(root,{childList:true});
  }
  // Do not block the initial page: keep the existing static packages visible immediately,
  // then replace them only after the CMS response succeeds.
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',()=>setTimeout(load,0),{once:true});
  else setTimeout(load,0);
})();
</script>

</body>
</html>
